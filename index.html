 function drawRadar(vals,labs){const svg=$('#radar'),cx=150,cy=150,R=105,n=5,pt=(r,i)=>[cx+Math.sin(i*2*Math.PI/n)*r,cy-Math.cos(i*2*Math.PI/n)*r];let grid='';[.25,.5,.75,1].forEach(k=>grid+=`<polygon points="${[0,1,2,3,4].map(i=>pt(R*k,i).join(',')).join(' ')}" fill="none" stroke="#cfc4b0" stroke-width="2"/>`);let axes=labs.map((l,i)=>{let p=pt(R,i),q=pt(R+27,i);return `<line x1="150" y1="150" x2="${p[0]}" y2="${p[1]}" stroke="#d8ceba" stroke-width="2"/><text x="${q[0]}" y="${q[1]}" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="900">${l}</text>`}).join('');let poly=vals.map((v,i)=>pt(R*v/100,i).join(',')).join(' ');svg.innerHTML=grid+axes+`<polygon points="${poly}" fill="#ed806b88" stroke="#262522" stroke-width="4"/>`+vals.map((v,i)=>{let p=pt(R*v/100,i);return `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#f4c65a" stroke="#262522" stroke-width="3"/>`}).join('')}

 function renderAssessment(){const grid=$('.result-grid');grid.querySelector('.assessment-card')?.remove();const card=document.createElement('div');card.className='dimension-card assessment-card';const a=assessment||buildAssessment(answers);card.innerHTML=`<div class="card-title"><h3>鑱屼笟娴嬭瘎鍧愭爣</h3><span>3 MODELS</span></div><div class="assessment-grid"><section class="assessment-box"><h4>闇嶅叞寰峰叴瓒?路 RIASEC</h4><div class="micro-bars">${a.labels.map((label,i)=>`<div class="micro-row"><span>${label}</span><div class="micro-track"><i style="width:${a.scores[i]}%"></i></div><b>${a.scores[i]}</b></div>`).join('')}</div></section><section class="assessment-box"><h4>鑱屼笟閿氬€惧悜</h4>${a.anchors.map(x=>`<div class="anchor-row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</section><section class="assessment-box"><h4>浼樺娍涓婚</h4><div class="strength-pills">${a.themes.map(x=>`<span>${x}</span>`).join('')}</div><p class="method-note">鍩轰簬 8 閬撴儏澧冮鐨勮交閲忓寲鑷瘎锛屽弬鑰冮湇鍏板痉鍏磋叮銆佽亴涓氶敋涓庝紭鍔夸富棰樻鏋讹紱浠呬緵鑱屼笟鎺㈢储锛屼笉绛夊悓浜庢爣鍑嗗寲蹇冪悊娴嬮獙銆?/p></section></div>`;grid.insertBefore(card,grid.querySelector('.jobs-card'))}
